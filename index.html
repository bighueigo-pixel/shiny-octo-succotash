<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運動小幫手工具箱</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f5f7; text-align: center; }
        .card { background: white; padding: 30px 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; margin-top: 30px; }
        h1 { color: #333; font-size: 24px; margin-top: 0; }
        p { color: #666; margin-bottom: 30px; }
        .btn { display: block; width: 100%; padding: 18px; margin: 15px 0; border-radius: 10px; font-size: 18px; font-weight: bold; text-decoration: none; color: white; box-sizing: border-box; transition: 0.2s; }
        .btn-signup { background-color: #06C755; }
        .btn-pay { background-color: #007BFF; }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="card">
        <h1>🛠️ 運動小幫手工具箱</h1>
        <p>請選擇您現在要使用的工具：</p>
        
        <!-- 連接到剛剛改名的報名小幫手 -->
        <a href="signup.html" class="btn btn-signup">📝 揪團報名小幫手 (產生圖卡)</a>
        
        <!-- 連接到舊的收款小幫手 -->
        <a href="pay.html" class="btn btn-pay">💰 羽球收款小幫手 (結算報表)</a>
    </div>
</body>
</html>
