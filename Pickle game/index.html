<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>匹克球互動戰術板 - 具備打擊感功能</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1a252f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    #header {
      margin-bottom: 12px;
      text-align: center;
    }

    #header h1 {
      font-size: 1.2rem;
      color: #ecf0f1;
      font-weight: 600;
    }

    #header p {
      font-size: 0.85rem;
      color: #bdc3c7;
      margin-top: 4px;
    }

    #game-container {
      position: relative;
      width: 90vw;
      max-width: 420px;
      aspect-ratio: 1 / 1.8;
      background-color: #27ae60; /* 球場綠色 */
      border: 6px solid #ffffff;
      border-radius: 12px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
      touch-action: none; /* 防止行動裝置滑動網頁 */
      overflow: hidden;
    }

    /* 擊球畫面微震動視覺效果 */
    .shake {
      animation: shake-anim 0.08s cubic-bezier(.36, .07, .19, .97) both 2;
    }

    @keyframes shake-anim {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-4px, 3px); }
      50% { transform: translate(4px, -2px); }
      75% { transform: translate(-2px, 2px); }
      100% { transform: translate(0, 0); }
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <div id="header">
    <h1>匹克球互動戰術板</h1>
    <p>在球場畫面上「按住拖曳並放開」即可進行擊球</p>
  </div>

  <div id="game-container">
    <canvas id="pickleball-canvas"></canvas>
  </div>

  <script>
    /**
     * Web Audio API 音效生成器 (無需加載外部音檔)
     */
    class SoundManager {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }

      playHitSound() {
        this.init();
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        // 模擬匹克球拍撞擊聲音 (Pop 聲)
        osc.type = 'sine';
        osc.frequency.setValueAtTime(750, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.06);

        gain.gain.setValueAtTime(1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }
    }

    /**
     * 3D 物理模擬球體 (含 Z 軸高度)
     */
    class Ball {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.z = 0; // 高度
        this.vx = 0;
        this.vy = 0;
        this.vz = 0;

        this.gravity = 0.75;
        this.friction = 0.975;
        this.bounceFactor = 0.55;
        this.radius = 11;
        this.isActive = false;
      }

      update() {
        if (!this.isActive) return;

        this.x += this.vx;
        this.y += this.vy;
        this.z += this.vz;

        this.vx *= this.friction;
        this.vy *= this.friction;
        this.vz -= this.gravity;

        // 落地碰撞判定
        if (this.z <= 0) {
          this.z = 0;
          if (Math.abs(this.vz) > 1.8) {
            this.vz *= -this.bounceFactor;
          } else {
            this.vz = 0;
            this.vx = 0;
            this.vy = 0;
            this.isActive = false;
          }
        }
      }

      draw(ctx) {
        // 繪製動態陰影
        const shadowOffset = this.z * 0.45;
        const shadowAlpha = Math.max(0.1, 0.45 - (this.z * 0.002));
        const shadowScale = Math.max(0.4, 1 - (this.z * 0.003));

        ctx.beginPath();
        ctx.arc(this.x, this.y + shadowOffset, this.radius * shadowScale, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 0, 0, ${shadowAlpha})`;
        ctx.fill();

        // 繪製實體匹克球 (螢光黃)
        const visualRadius = this.radius + (this.z * 0.08);
        ctx.beginPath();
        ctx.arc(this.x, this.y, visualRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#f1c40f';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#d4ac0d';
        ctx.stroke();

        // 球體孔洞質感裝飾
        ctx.beginPath();
        ctx.arc(this.x - visualRadius * 0.3, this.y - visualRadius * 0.3, visualRadius * 0.2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
        ctx.fill();
      }
    }

    /**
     * 戰術板遊戲引擎
     */
    class TacticsBoardApp {
      constructor() {
        this.container = document.getElementById('game-container');
        this.canvas = document.getElementById('pickleball-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.soundManager = new SoundManager();

        this.resizeCanvas();
        this.ball = new Ball(this.width / 2, this.height * 0.75);
        this.dragStart = null;

        this.initEvents();
        this.render();
      }

      resizeCanvas() {
        this.width = this.container.clientWidth;
        this.height = this.container.clientHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;
      }

      initEvents() {
        this.canvas.addEventListener('pointerdown', (e) => this.onPointerDown(e));
        this.canvas.addEventListener('pointerup', (e) => this.onPointerUp(e));

        window.addEventListener('resize', () => {
          this.resizeCanvas();
          if (!this.ball.isActive) {
            this.ball.x = this.width / 2;
            this.ball.y = this.height * 0.75;
          }
        });
      }

      onPointerDown(e) {
        const rect = this.canvas.getBoundingClientRect();
        this.dragStart = {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top,
          time: Date.now()
        };

        this.ball.x = this.dragStart.x;
        this.ball.y = this.dragStart.y;
        this.ball.z = 0;
        this.ball.isActive = false;
      }

      onPointerUp(e) {
        if (!this.dragStart) return;

        const rect = this.canvas.getBoundingClientRect();
        const dragEnd = {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top
        };

        const duration = Math.max(10, Date.now() - this.dragStart.time);
        const dx = dragEnd.x - this.dragStart.x;
        const dy = dragEnd.y - this.dragStart.y;

        // 計算擊球力道與方向
        this.ball.vx = dx / (duration * 0.12);
        this.ball.vy = dy / (duration * 0.12);
        this.ball.vz = Math.min(22, (Math.abs(dx) + Math.abs(dy)) / (duration * 0.08));
        this.ball.isActive = true;

        this.triggerImpact();
        this.dragStart = null;
      }

      triggerImpact() {
        // 1. 音效回饋
        this.soundManager.playHitSound();

        // 2. 觸覺震動 (行動裝置)
        if (navigator.vibrate) {
          navigator.vibrate(35);
        }

        // 3. 畫面震動效果
        this.container.classList.remove('shake');
        void this.container.offsetWidth; 
        this.container.classList.add('shake');
      }

      checkBounds() {
        if (this.ball.x < this.ball.radius || this.ball.x > this.width - this.ball.radius) {
          this.ball.vx *= -0.8;
        }
        if (this.ball.y < this.ball.radius || this.ball.y > this.height - this.ball.radius) {
          this.ball.vy *= -0.8;
        }
      }

      drawCourtLines() {
        this.ctx.strokeStyle = '#ffffff';
        this.ctx.lineWidth = 3;

        // 邊框界線
        this.ctx.strokeRect(10, 10, this.width - 20, this.height - 20);

        // 球網 (Net)
        const netY = this.height / 2;
        this.ctx.beginPath();
        this.ctx.lineWidth = 5;
        this.ctx.strokeStyle = '#e74c3c';
        this.ctx.moveTo(8, netY);
        this.ctx.lineTo(this.width - 8, netY);
        this.ctx.stroke();

        // 廚房區線 (Non-Volley Zone / Kitchen)
        this.ctx.lineWidth = 3;
        this.ctx.strokeStyle = '#ffffff';

        const kitchenDepth = this.height * 0.18;
        // 上方廚房線
        this.ctx.beginPath();
        this.ctx.moveTo(10, netY - kitchenDepth);
        this.ctx.lineTo(this.width - 10, netY - kitchenDepth);
        this.ctx.stroke();

        // 下方廚房線
        this.ctx.beginPath();
        this.ctx.moveTo(10, netY + kitchenDepth);
        this.ctx.lineTo(this.width - 10, netY + kitchenDepth);
        this.ctx.stroke();

        // 中線 (Center lines)
        this.ctx.beginPath();
        this.ctx.moveTo(this.width / 2, 10);
        this.ctx.lineTo(this.width / 2, netY - kitchenDepth);
        this.ctx.moveTo(this.width / 2, netY + kitchenDepth);
        this.ctx.lineTo(this.width / 2, this.height - 10);
        this.ctx.stroke();
      }

      render() {
        this.ctx.clearRect(0, 0, this.width, this.height);

        // 繪製標準匹克球場
        this.drawCourtLines();

        // 更新與繪製球體
        this.ball.update();
        this.checkBounds();
        this.ball.draw(this.ctx);

        requestAnimationFrame(() => this.render());
      }
    }

    // 初始化啟動
    window.addEventListener('load', () => {
      new TacticsBoardApp();
    });
  </script>
</body>
</html>
