<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>揪團報名小幫手</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background-color: #f4f5f7; margin: 0; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h2 { margin-top: 0; color: #06C755; font-size: 20px; text-align: center; margin-bottom: 15px; }
        
        /* 雙欄與三欄式排版 */
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
        .full-width { grid-column: span 2; }
        .flex-3-cols { display: flex; gap: 10px; }
        .flex-3-cols > div { flex: 1; min-width: 0; }
        
        label { display: block; font-weight: bold; color: #444; font-size: 13px; margin-bottom: 4px; white-space: nowrap; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 15px; background-color: #fafafa; }
        textarea { height: 70px; resize: none; }
        
        .hidden { display: none; }
        .btn-primary { width: 100%; padding: 12px; background-color: #06C755; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-dark { width: 100%; padding: 12px; background-color: #333; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #resultText { height: 350px; line-height: 1.4; background-color: #fff; }
        
        /* 名單即時預覽文字 */
        .preview-text { font-size: 13px; color: #06C755; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>📝 揪團報名小幫手</h2>
        
        <div class="grid-container">
            <!-- 第一列：日期與時間 (三欄並排) -->
            <div class="full-width flex-3-cols">
                <div>
                    <label>日期</label>
                    <input type="date" id="eventDate" style="padding-left: 2px; padding-right: 2px;">
                </div>
                <div>
                    <label>開始</label>
                    <input type="time" id="startTime" style="padding-left: 2px; padding-right: 2px;">
                </div>
                <div>
                    <label>結束</label>
                    <input type="time" id="endTime" style="padding-left: 2px; padding-right: 2px;">
                </div>
            </div>

            <!-- 第二列：球聚與主揪 -->
            <div>
                <label>球聚種類</label>
                <select id="sportType" onchange="toggleCustomSport()">
                    <option value="匹克球" selected>匹克球</option>
                    <option value="羽球">羽球</option>
                    <option value="保齡球">保齡球</option>
                    <option value="籃球">籃球</option>
                    <option value="桌球">桌球</option>
                    <option value="撞球">撞球</option>
                    <option value="custom">其他 (輸入)</option>
                </select>
            </div>
            <div>
                <label>主揪值日生</label>
                <input type="text" id="host" placeholder="例如: 小明">
            </div>
            
            <!-- 隱藏的自訂項目輸入框 -->
            <div id="customSportBox" class="full-width hidden">
                <input type="text" id="customSport" placeholder="請輸入自訂項目名稱">
            </div>

            <!-- 第三列：場地與地址 (連動) -->
            <div>
                <label>場地名稱</label>
                <select id="venueSelect" onchange="autoFillAddress()">
                    <option value="新羽力羽球俱樂部5號場">新羽力羽球俱樂部5號場</option>
                    <option value="易羽球館">易羽球館</option>
                    <option value="小碧潭京站美食廣場5F">小碧潭京站美食廣場5F</option>
                    <option value="custom">自訂場地 (輸入)</option>
                </select>
            </div>
            <div>
                <label>地址</label>
                <input type="text" id="address" placeholder="自動帶入或自行輸入">
            </div>

            <!-- 隱藏的自訂場地輸入框 -->
            <div id="customVenueBox" class="full-width hidden">
                <input type="text" id="customVenue" placeholder="請輸入自訂場地名稱">
            </div>

            <!-- 第四列：費用 -->
            <div>
                <label>總場地費 ($)</label>
                <input type="number" id="courtFee" placeholder="例: 1200">
            </div>
            <div>
                <label>器材/雜費 ($)</label>
                <input type="number" id="itemFee" placeholder="無則填0">
            </div>

            <!-- 第五列：人數設定 -->
            <div>
                <label>預計滿團人數</label>
                <select id="maxPeopleSelect">
                    <!-- 程式自動產生 1~24 -->
                </select>
            </div>
            <div>
                <label>目前報名人數</label>
                <select id="peopleSelect" onchange="toggleCustomPeople()">
                    <!-- 1~14 -->
                </select>
                <input type="number" id="customPeople" class="hidden" placeholder="請輸入超過14人的人數" style="margin-top:5px;">
            </div>

            <!-- 第六列：智慧名單 -->
            <div class="full-width">
                <label>智慧參加名單 (貼上後自動排版與除錯)</label>
                <textarea id="participants" placeholder="可直接貼上帶有數字的名單，系統會自動淨化" oninput="autoCountParticipants()"></textarea>
                <div id="parsedNamesDisplay" class="preview-text"></div>
            </div>
        </div>

        <button class="btn-primary" onclick="calculate()">計算並產生報表</button>
    </div>

    <div class="card">
        <label>自動產生的 LINE 訊息：</label>
        <textarea id="resultText" readonly></textarea>
        <button class="btn-dark" onclick="copyText()">一鍵複製貼上 LINE</button>
    </div>

    <script>
        // 設定場地資料庫
        const venueData = {
            "新羽力羽球俱樂部5號場": "新北市新店區安康路二段295-3號",
            "易羽球館": "新北市新店區安泰路58號之1",
            "小碧潭京站美食廣場5F": "新北市新店區中央路157號5樓"
        };

        document.addEventListener('DOMContentLoaded', () => {
            // 自動帶入當下日期
            const now = new Date();
            const localISOTime = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString();
            document.getElementById('eventDate').value = localISOTime.split('T')[0];
            
            // 常設時間：預設下午 2:00 到 4:00
            document.getElementById('startTime').value = '14:00';
            document.getElementById('endTime').value = '16:00';

            // 產生 1~24 人的滿團選項 (預設選 8 人)
            const maxPeopleSelect = document.getElementById('maxPeopleSelect');
            for (let i = 1; i <= 24; i++) {
                let selected = (i === 8) ? "selected" : "";
                maxPeopleSelect.innerHTML += `<option value="${i}" ${selected}>${i} 人</option>`;
            }

            // 產生目前報名人數選項
            const peopleSelect = document.getElementById('peopleSelect');
            for (let i = 1; i <= 14; i++) {
                peopleSelect.innerHTML += `<option value="${i}">${i} 人</option>`;
            }
            peopleSelect.innerHTML += `<option value="custom">15人以上 (自行輸入)</option>`;

            // 初始化：載入預設第一個場地的地址
            autoFillAddress();
        });

        function toggleCustomSport() {
            const select = document.getElementById('sportType');
            const box = document.getElementById('customSportBox');
            if (select.value === 'custom') box.classList.remove('hidden');
            else box.classList.add('hidden');
        }

        function autoFillAddress() {
            const select = document.getElementById('venueSelect');
            const box = document.getElementById('customVenueBox');
            const addressInput = document.getElementById('address');
            
            if (select.value === 'custom') {
                box.classList.remove('hidden');
                addressInput.value = '';
            } else {
                box.classList.add('hidden');
                if (venueData[select.value] !== undefined) {
                    addressInput.value = venueData[select.value];
                }
            }
        }

        function toggleCustomPeople() {
            const select = document.getElementById('peopleSelect');
            const customInput = document.getElementById('customPeople');
            if (select.value === 'custom') customInput.classList.remove('hidden');
            else customInput.classList.add('hidden');
        }

        // 核心功能：解析名單並去除前面的數字編號
        function getCleanedNames() {
            const text = document.getElementById('participants').value;
            // 透過空白、逗號、換行符號切割
            let rawNames = text.split(/[\s,，、\n]+/);
            
            // 利用正規表達式過濾掉開頭的數字及常見標點 (如 "1. ", "2)", "3、")
            return rawNames
                .map(n => n.replace(/^[0-9]+[\.。、,，)）]?\s*/, '').trim())
                .filter(n => n !== '');
        }

        function autoCountParticipants() {
            const names = getCleanedNames();
            const count = names.length;
            
            const peopleSelect = document.getElementById('peopleSelect');
            const customInput = document.getElementById('customPeople');
            const previewDisplay = document.getElementById('parsedNamesDisplay');

            if (count > 0) {
                previewDisplay.innerText = `✅ 成功辨識 ${count} 人：${names.join('、')}`;

                if (count <= 14) {
                    peopleSelect.value = count;
                    customInput.classList.add('hidden');
                } else {
                    peopleSelect.value = 'custom';
                    customInput.classList.remove('hidden');
                    customInput.value = count;
                }
            } else {
                previewDisplay.innerText = "";
            }
        }

        function calculate() {
            const dateStr = document.getElementById('eventDate').value;
            const startTime = document.getElementById('startTime').value || '未填寫';
            const endTime = document.getElementById('endTime').value || '未填寫';
            const host = document.getElementById('host').value || '未填寫';
            
            let sport = document.getElementById('sportType').value;
            if (sport === 'custom') sport = document.getElementById('customSport').value || '未填寫項目';

            // 解析日期格式 (從 YYYY-MM-DD 轉成 M月D日)
            let formattedDate = '未填寫日期';
            if (dateStr) {
                const dateObj = new Date(dateStr);
                const month = dateObj.getMonth() + 1;
                const day = dateObj.getDate();
                formattedDate = `${month}月${day}日`;
            }

            let venueName = document.getElementById('venueSelect').value;
            if (venueName === 'custom') {
                venueName = document.getElementById('customVenue').value || '未填寫場地';
            }

            const address = document.getElementById('address').value || '未提供';
            const courtFee = parseInt(document.getElementById('courtFee').value) || 0;
            const itemFee = parseInt(document.getElementById('itemFee').value) || 0;
            
            // 取得滿團人數與目前人數
            const maxPeople = parseInt(document.getElementById('maxPeopleSelect').value) || 8;
            let currentPeople = document.getElementById('peopleSelect').value;
            if (currentPeople === 'custom') currentPeople = document.getElementById('customPeople').value;
            currentPeople = parseInt(currentPeople) || 1;

            // 取得已經去除數字編號的乾淨名單
            const nameArray = getCleanedNames();
            
            // 根據滿團人數，重新產生乾淨且一致的數字編碼
            let numberedNameList = "";
            for (let i = 0; i < maxPeople; i++) {
                let name = nameArray[i] ? nameArray[i] : "";
                numberedNameList += `${i + 1}. ${name}\n`;
            }
            numberedNameList = numberedNameList.replace(/\n$/, "");

            const total = courtFee + itemFee;
            // 均攤費用以目前報名人數計算
            const perPerson = Math.ceil(total / currentPeople); 

            // 生成最短版的 Google Maps 連結
            let mapLinkText = '';
            if (address !== '未提供' && address.trim() !== '') {
                const encodedAddress = encodeURIComponent(address);
                mapLinkText = ` 📍導航: https://maps.google.com/?q=${encodedAddress}`;
            }

            const report = `【${formattedDate}${sport}揪團一覽表】
⏰ 時間：${startTime} ~ ${endTime}
👤 值日生：${host}
📍 場地：${venueName}
🗺️ 地址：${address}${mapLinkText}
--------------------
👥 參加名單 (${currentPeople}/${maxPeople}人)：
${numberedNameList}
--------------------
💵 場地費用：$${courtFee}
🎾 器材雜費：$${itemFee}
💰 目前每人均攤：$${perPerson}

請大家將費用交給值日生，謝謝大家的參與！`;

            document.getElementById('resultText').value = report;
        }

        function copyText() {
            const text = document.getElementById('resultText');
            text.select();
            text.setSelectionRange(0, 99999); 
            document.execCommand('copy');
            alert('✅ 報表已複製！現在可以直接去 LINE 群組貼上了。');
        }
    </script>
</body>
</html>
